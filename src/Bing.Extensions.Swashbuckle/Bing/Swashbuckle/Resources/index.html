<body>

    <div id="swagger-ui"></div>
    <!--<script src="resources?name=index.js" charset="utf-8"></script>-->

    <script src="%(ScriptBundlePath)" charset="utf-8"></script>
    <script src="%(ScriptPresetsPath)" charset="utf-8"></script>
    <!--<script src="index.js" charset="utf-8"></script>-->
    <!--<script src="./swagger-ui-bundle.js"></script>-->
    <!--<script src="./swagger-ui-standalone-preset.js"></script>-->
    <!--<script src="https://unpkg.com/swagger-ui-dist@5.22.0/swagger-ui-bundle.js" crossorigin></script>-->
    <!--<script src="https://unpkg.com/swagger-ui-dist@5.22.0/swagger-ui-standalone-preset.js" crossorigin></script>-->
    <!--<script src="https://unpkg.com/@asciidoctor/core@2.2.6/dist/browser/asciidoctor.js" crossorigin></script>-->
    <script>
        /* Source: https://gist.github.com/lamberta/3768814
        * Parse a string function definition and return a function object. Does not use eval.
        * @param {string} str
        * @return {function}
        *
        * Example:
        *  var f = function (x, y) { return x * y; };
        *  var g = parseFunction(f.toString());
        *  g(33, 3); //=> 99
        */
        function parseFunction(str) {
            if (!str) return void (0);

            var fn_body_idx = str.indexOf('{'),
                fn_body = str.substring(fn_body_idx + 1, str.lastIndexOf('}')),
                fn_declare = str.substring(0, fn_body_idx),
                fn_params = fn_declare.substring(fn_declare.indexOf('(') + 1, fn_declare.lastIndexOf(')')),
                args = fn_params.split(',');

            args.push(fn_body);

            function Fn() {
                return Function.apply(this, args);
            }
            Fn.prototype = Function.prototype;

            return new Fn();
        }

        /**
        * 创建最后修改信息插件
        * @returns {Object} 插件对象
        */
        function createLastModifiedPlugin() {
            return function () {
                return {
                    components: {
                        Operation: (Original, system) => (props) => {
                            try {
                                const { operation } = props;
                                if (!operation) {
                                    console.warn("Operation not found in props");
                                    return Original(props);
                                }

                                const lastModified = operation.get("x-lastModified");
                                const author = operation.get("x-author");
                                const operationId = operation.get("operationId");

                                console.log("LastModified plugin running for", operationId, {
                                    lastModified,
                                    author
                                });

                                if (lastModified || author) {
                                    let summary = operation.get("summary") || "";
                                    let additionalInfo = "";

                                    if (lastModified) additionalInfo += `🕒 ${lastModified} `;
                                    if (author) additionalInfo += `👤 ${author}`;

                                    if (additionalInfo) {
                                        summary += ` — ${additionalInfo}`;
                                        props = {
                                            ...props,
                                            operation: operation.set("summary", summary)
                                        };
                                    }
                                }

                                return Original(props);
                            } catch (error) {
                                console.error("Error in LastModified plugin:", error);
                                return Original(props);
                            }
                        }
                    }
                };
            };
        }

        /**
        * 处理和合并插件
        * @param {Object} configObject 配置对象
        */
        function processPlugins(configObject) {
            console.log("Processing plugins...");

            // 初始化默认插件数组
            var defaultPlugins = [];

            // 添加内置的 DownloadUrl 插件
            if (SwaggerUIBundle.plugins && SwaggerUIBundle.plugins.DownloadUrl) {
                defaultPlugins.push(SwaggerUIBundle.plugins.DownloadUrl);
            }

            // 处理从服务器传入的插件配置
            var serverPlugins = [];
            if (configObject.plugins && Array.isArray(configObject.plugins)) {
                console.log("Found server plugins:", configObject.plugins.length);

                // 解析字符串形式的插件函数
                serverPlugins = configObject.plugins.map(function (plugin) {
                    if (typeof plugin === 'string') {
                        try {
                            return eval('(' + plugin + ')');
                        } catch (error) {
                            console.error("Error parsing plugin function:", error);
                            return null;
                        }
                    }
                    return plugin;
                }).filter(function (plugin) {
                    return plugin !== null;
                });
            }

            // 添加自定义的最后修改信息插件
            var customPlugins = [
                createLastModifiedPlugin()
            ];

            // 合并所有插件
            configObject.plugins = defaultPlugins.concat(serverPlugins, customPlugins);

            console.log("Final plugins array:", configObject.plugins);
            console.log("Total plugins count:", configObject.plugins.length);
        }

        window.onload = function () {
            var configObject = JSON.parse('%(ConfigObject)');
            var oauthConfigObject = JSON.parse('%(OAuthConfigObject)');

            console.log('Initial configObject:', configObject);
            console.log('oauthConfigObject:', oauthConfigObject);

            // Workaround for https://github.com/swagger-api/swagger-ui/issues/5945
            if (configObject.urls && Array.isArray(configObject.urls)) {
                configObject.urls.forEach(function (item) {
                    if (item.url.startsWith("http") || item.url.startsWith("/"))
                        return;
                    item.url = window.location.href.replace("index.html", item.url).split('#')[0];
                });
            }

            // If validatorUrl is not explicitly provided, disable the feature by setting to null
            // 如果没有显式提供validatorUrl，请通过设置为null禁用该功能
            if (!configObject.hasOwnProperty("validatorUrl"))
                configObject.validatorUrl = null

            // If oauth2RedirectUrl isn't specified, use the built-in default
            // 如果未指定oauth2RedirectUrl，则使用内置默认值
            if (!configObject.hasOwnProperty("oauth2RedirectUrl")) {
                console.log('Setting oauth2RedirectUrl');
                // TODO: configObject.oauth2RedirectUrl = window.location.href.replace("index.html", "oauth2-redirect.html").split('#')[0];
                configObject.oauth2RedirectUrl = (new URL("oauth2-redirect.html", window.location.href)).href;
            }

            // Apply mandatory parameters
            configObject.dom_id = "#swagger-ui";
            configObject.presets = [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset];
            configObject.layout = "StandaloneLayout";
            configObject.requestSnippetsEnabled = true;

            // Parse and add interceptor functions
            var interceptors = JSON.parse('%(Interceptors)');
            if (interceptors.RequestInterceptorFunction) {
                var customRequestInterceptor = parseFunction(interceptors.RequestInterceptorFunction);
                configObject.requestInterceptor = customRequestInterceptor;
            }
            if (interceptors.ResponseInterceptorFunction) {
                configObject.responseInterceptor = parseFunction(interceptors.ResponseInterceptorFunction);
            }

            // 如果没有自定义的请求拦截器，则使用默认的 CSRF 处理
            if (!configObject.requestInterceptor) {
                configObject.requestInterceptor = (request) => {
                    var csrfTokenCookie = getCookieValue('X-CSRF-TOKEN');
                    if (csrfTokenCookie !== undefined && csrfTokenCookie !== null) {
                        request.headers['X-CSRF-TOKEN'] = csrfTokenCookie;
                    }
                    console.log('Request headers:', request.headers);
                    return request;
                };
            }

            // 处理插件
            processPlugins(configObject);
            //if (configObject.plugins) {
            //    configObject.plugins = configObject.plugins.map(eval);
            //}

            // 初始化Token存储
            initTokenStorage(configObject);

            console.log('Final configObject before SwaggerUIBundle:', configObject);

            // Begin Swagger UI call region
            const ui = SwaggerUIBundle(configObject);

            ui.initOAuth(oauthConfigObject);
            customTranslate(configObject);

            // End Swagger UI call region
            window.ui = ui
        }

        /**
         * 获取Cookie值
         * @param {string} key
         * @returns
         */
        function getCookieValue(key) {
            var equalities = document.cookie.split('; ');
            for (var i = 0; i < equalities.length; i++) {
                if (!equalities[i]) {
                    continue;
                }

                var splitted = equalities[i].split('=');
                if (splitted.length !== 2) {
                    continue;
                }

                if (decodeURIComponent(splitted[0]) === key) {
                    return decodeURIComponent(splitted[1] || '');
                }
            }

            return null;
        }

        /**
         * 自定义翻译
         * @param {any} configObject
         */
        function customTranslate(configObject) {
            window.swagger_config = configObject;
            //document.getElementsByTagName('span')[0].innerText =
            //    document.getElementsByTagName('span')[0].innerText.replace('swagger', '项目接口文档');
            //document.getElementsByTagName('span')[1].innerText =
            //    document.getElementsByTagName('span')[1].innerText.replace('Select a spec', '版本选择');
            if (configObject.customAuth) {
                var logOutEle = document.createElement('button');
                logOutEle.className = "btn ";
                logOutEle.innerText = "退出";
                logOutEle.onclick = function () {
                    location.href = configObject.logoutUrl;
                }
                document.getElementsByClassName('topbar-wrapper')[0].appendChild(logOutEle);
            }
        }

        /**
         * 初始化Token存储
         * @param {any} configObject 配置对象
         * @returns
         */
        function initTokenStorage(configObject) {
            if (!configObject.token_storage_cache_type)
                return;
            configObject.onComplete = () => {
                var result = getTokenStorage(configObject);
                if (result === undefined || result === null || result === "")
                    return;
                ui.preauthorizeApiKey(configObject.token_storage_security_definition, result);
            };
            configObject.requestInterceptor = (req) => {
                var result = getTokenStorage(configObject);
                if (result === undefined || result === null || result === "")
                    return req;
                req.headers["Authorization"] = result;
                return req;
            };
        }

        /**
         * 获取Token存储
         * @param {any} configObject 配置对象
         * @returns {string|null}
         */
        function getTokenStorage(configObject) {
            if (!configObject.persistAuthorization)
                return null;
            try {
                var authorized = localStorage.getItem("authorized");
                if (!authorized)
                    return null;
                var data = JSON.parse(authorized);
                const key = configObject.token_storage_security_definition;
                if (!data[key])
                    return null;
                return data[key].value;
            } catch (error) {
                console.error("Error getting token storage:", error);
                return null;
            }
        }
    </script>
</body>

</html>
